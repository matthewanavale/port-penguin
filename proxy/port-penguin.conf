# Port Penguin reverse proxy with HTTPS
# 1. Replace penguin.example.com with your domain (two places below).
# 2. Create the certificate: sudo ./make-self-signed-cert.sh penguin.example.com
# 3. Save this file as /etc/nginx/sites-available/port-penguin.conf
#    (or /etc/nginx/conf.d/port-penguin.conf, depending on your setup).
# 4. sudo nginx -t && sudo systemctl reload nginx

# Send plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name penguin.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name penguin.example.com;

    ssl_certificate     /etc/ssl/port-penguin/fullchain.pem;
    ssl_certificate_key /etc/ssl/port-penguin/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:PortPenguinSSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
