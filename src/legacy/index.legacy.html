<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2133">
<meta name="description" content="Learn Linux commands and Docker by playing a terminal game.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECF0; --panel:#F8FAFB; --ink:#12263A; --muted:#55697B; --line:#C6D1DA; --accent:#2858A6;
  --c1:#2E62B3; --c2:#2F8A82; --c3:#C98F1E; --c4:#7B57B0; --c5:#5E8C31; --c6:#C2503A; --c7:#1F7A9E; --c8:#B0407A;
  --term:#0F2133; --tink:#D8E4ED; --tdim:#8199AD; --tprompt:#F2C14E; --tpath:#8FB8F5; --tok:#7DD3C4; --terr:#F5A08B; --texe:#9EE493;
  --sans:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1822; --panel:#132331; --ink:#E2EBF1; --muted:#94A9BA; --line:#263C4E; --accent:#7EA9EC;
    --c1:#5C8FDB; --c2:#4DB0A6; --c3:#E6B550; --c4:#A585DB; --c5:#8DBE5C; --c6:#E07158; --c7:#4FB0D6; --c8:#DE6FA8; --term:#08131D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1822; --panel:#132331; --ink:#E2EBF1; --muted:#94A9BA; --line:#263C4E; --accent:#7EA9EC;
  --c1:#5C8FDB; --c2:#4DB0A6; --c3:#E6B550; --c4:#A585DB; --c5:#8DBE5C; --c6:#E07158; --c7:#4FB0D6; --c8:#DE6FA8; --term:#08131D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;display:flex;flex-direction:column;min-height:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-size:30px;line-height:1}
.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.top p{margin:0;color:var(--muted);font-size:14px}
.rank{text-align:right;line-height:1.25}
.rank strong{display:block;font-size:16px}
.rank span{color:var(--muted);font-size:13px}

.layout{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;padding:18px 22px;min-height:0}

.term{display:flex;flex-direction:column;min-height:0;border-radius:10px;overflow:hidden;background:var(--term);box-shadow:0 0 0 1px var(--line)}
.term:focus-within{box-shadow:0 0 0 2px var(--accent)}
.term-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;color:var(--tdim);font-family:var(--mono);font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.07)}
.term-bar button{background:none;border:1px solid rgba(255,255,255,.14);color:var(--tdim);border-radius:5px;padding:2px 10px;font-family:var(--mono);font-size:12px}
.term-bar button:hover{color:var(--tink)}
.screen{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 20px;color:var(--tink);font-family:var(--mono);font-size:14.5px;line-height:1.6;cursor:text;overscroll-behavior:contain}
.ln{white-space:pre-wrap;word-break:break-word;min-height:1.6em}
.cmdl{margin-top:6px}
.pu{color:var(--tprompt);font-weight:700}
.pp{color:var(--tpath);font-weight:700}
.err{color:var(--terr)}
.dim{color:var(--tdim)}
.ok{color:var(--tok);font-weight:700}
.dir{color:var(--tpath);font-weight:700}
.exe{color:var(--texe);font-weight:700}
.hl{background:rgba(242,193,78,.22);color:var(--tprompt);border-radius:2px}
.sys{border-left:3px solid var(--tok);padding:4px 0 4px 12px;margin:10px 0 4px}
.sys.big{border-left-color:var(--tprompt)}
.sys.alert{border-left-color:var(--terr)}
.inline{display:flex;align-items:baseline;gap:1ch;margin-top:6px}
.inline input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--tink);caret-color:var(--tprompt);padding:0;font-family:var(--mono);font-size:inherit}
.keys{display:none;gap:6px;padding:8px 10px;border-top:1px solid rgba(255,255,255,.07);overflow-x:auto}
.keys button{flex:0 0 auto;background:rgba(255,255,255,.07);border:0;color:var(--tink);font-family:var(--mono);font-size:15px;border-radius:6px;padding:8px 13px}
@media (pointer:coarse){.keys{display:flex}}

.panel{display:flex;flex-direction:column;gap:16px;min-height:0;overflow-y:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.mission{border-top:5px solid var(--cc)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted)}
.meta b{color:var(--cc);font-weight:600}
.mission h2{margin:6px 0 8px;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.mission p{margin:0 0 12px}
.goal{background:color-mix(in srgb,var(--cc) 12%,transparent);border-radius:7px;padding:10px 12px;font-weight:600}
code{font-family:var(--mono);font-size:.88em;background:color-mix(in srgb,var(--ink) 8%,transparent);padding:1px 5px;border-radius:4px}
.hint{margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:7px;font-size:15px}
.hint[hidden],.unlock[hidden]{display:none}
.chip{font-family:var(--mono);font-size:13.5px;background:var(--term);color:var(--tink);border:0;border-radius:5px;padding:3px 8px;margin:2px 0;text-align:left}
.chip:hover{color:var(--tprompt)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:7px;padding:6px 13px;font-size:14.5px;font-weight:600}
.btn.primary{background:var(--cc);border-color:var(--cc);color:#fff}
.btn:hover{border-color:var(--ink)}
.unlock{margin-top:12px}
.unlock label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.unlock .pwrow{display:flex;gap:8px}
.unlock input{flex:1;min-width:0;border:1px solid var(--line);background:transparent;border-radius:7px;padding:6px 10px;font-size:16px}
.unlock p{margin:6px 0 0;font-size:14px;color:var(--c6)}

.yard h3,.learned summary{margin:0 0 10px;font-size:16px;font-weight:800;letter-spacing:-.01em}
.row{display:grid;grid-template-columns:120px 1fr;align-items:start;gap:8px;margin:8px 0}
.row span{font-size:13px;color:var(--muted);line-height:1.25}
.boxes{display:flex;flex-wrap:wrap;gap:4px}
.box{display:block;width:24px;height:15px;padding:0;border:2px dashed var(--line);border-radius:2px;background:transparent}
.box.cur{border-style:solid;border-color:var(--cc)}
.box.done{border:2px solid color-mix(in srgb,var(--cc) 70%,#000);background:repeating-linear-gradient(90deg,var(--cc) 0 3px,color-mix(in srgb,var(--cc) 72%,#000) 3px 4px)}
.box.land{animation:land .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{from{transform:translateY(-14px) scale(1.15)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.box.land{animation:none}}
.yard small{display:block;color:var(--muted);font-size:13px;margin-top:8px}
.learned summary{cursor:pointer;margin:0}
.learned dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px}
.learned dt code{white-space:nowrap}
.learned dd{margin:0;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}

@media (min-width:881px){html,body{height:100%}}
@media (max-width:880px){
  .layout{grid-template-columns:1fr;padding:12px}
  .panel{order:-1;overflow:visible}
  .term{height:64svh;min-height:380px}
  .screen{font-size:14px}
  .inline input{font-size:16px}
  .top{padding:12px}
  .top p{display:none}
  .row{grid-template-columns:100px 1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">🐧</span>
    <div><h1>Port Penguin</h1><p>Learn Linux and Docker by running a harbor</p></div>
  </div>
  <div class="rank"><strong id="rankName">Deckhand</strong><span id="xp">0 XP</span></div>
</header>

<main class="layout">
  <section class="term" aria-label="Practice terminal">
    <div class="term-bar"><span>sandbox terminal</span><button id="clearBtn" type="button">Clear screen</button></div>
    <div class="screen" id="screen">
      <div id="out" role="log" aria-live="polite"></div>
      <div class="inline"><span id="prompt"></span><input id="cmd" type="text" aria-label="Type a command" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"></div>
    </div>
    <div class="keys" id="keys" aria-label="Extra keys">
      <button type="button" data-k="tab">Tab</button>
      <button type="button" data-k="up">↑</button>
      <button type="button" data-k="down">↓</button>
      <button type="button" data-k="-">-</button>
      <button type="button" data-k="/">/</button>
      <button type="button" data-k="~">~</button>
      <button type="button" data-k="|">|</button>
      <button type="button" data-k=">">&gt;</button>
      <button type="button" data-k="$">$</button>
    </div>
  </section>

  <aside class="panel">
    <div class="card mission" id="mission"></div>
    <div class="card yard" id="yard"></div>
    <details class="card learned" id="learned"></details>
    <div class="foot"><span>Progress saves in this browser.</span><span><button type="button" id="lockBtn" hidden>Lock hints</button> <button type="button" id="resetBtn">Reset progress</button></span></div>
  </aside>
</main>

<script>
(function(){
"use strict";
/* ============================================================

const HINT_HASH='daa65e53e654c24789be703e527937e31d28b4c814524f0f10a020e050f154b6';

const HOME='/home/cadet', HOST='port-penguin', KEY='port-penguin-v2';

/* ---------- File contents ---------- */
const WELCOME=`Welcome to Port Penguin, dockhand! 🐧

This terminal is a sandbox. Nothing you type here can harm a real computer,
so experiment freely.

Your logbook lists one task at a time. Finish it and the next one appears.

Captain’s code word: BARNACLE

Files whose names start with a dot are hidden from a plain ls.

`;
const NOTES=`Shipment schedule
Monday     40 containers of bananas

`;
const CREW=`Marina
Otto
Gus
Pearl
Otto
Barney
Marina

Coral
Gus
`;
const SYSLOG=`2026-11-24 06:00:01 INFO  Harbor systems online
2026-11-24 06:02:13 INFO  Crane 1 calibrated
2026-11-24 06:05:47 WARN  Fog detected near pier 3
2026-11-24 06:11:09 ERROR Crane 2 hydraulic pressure low

`;
const CRANELOG=`crane-1 lift ok 18t
crane-2 lift ok 22t
crane-2 pressure low
crane-1 idle
`;
const MANIFEST=`CRATE MANIFEST (1998)
Crate 0001  Cargo: 300 tins of sardines
Crate 0002  Cargo: one (1) grand piano
Crate 0003  Cargo: classified
`;
const INDEX=`<!DOCTYPE html>
<html>
  <head><title>Port Penguin</title></head>
  <body><h1>Welcome to Port Penguin</h1></body>
</html>
`;
const APP=`from flask import Flask

app = Flask(__name__)

@app.route("/")
def home():
    return "Hello from the harbor! 🚢"

if __name__ == "__main__":
    app.run(host="0.0.0.0", port=5000)
`;
const BROKEN_APP=`from flask import Flask

app = Flask(__name__)

@app.route("/")
def home():
    return "Status: all piers operational ⚓"

if __name__ == "__main__":
    app.run(host="0.0.0.0", port=5000)
`;
const DOCKERFILE=`# Start from a small official Python image
FROM python:3.12-slim
WORKDIR /app
COPY . .
RUN pip install flask
EXPOSE 5000
CMD ["python", "app.py"]
`;
const BROKEN_DOCKERFILE=`# Harbor status page
FORM python:3.12-slim
WORKDIR /app
COPY . .
RUN pip install flask
EXPOSE 5000
CMD ["python", "app.py"]
`;
const COMPOSE=`# The harbor stack: a web server and a cache
services:
  web:
    image: nginx
    ports:
      - "8081:80"
    depends_on:
      - cache
  cache:
    image: redis
    volumes:
      - cache-data:/data

volumes:
  cache-data:
`;
const DEPLOY=`#!/bin/bash
# Deploy script for the harbor website
echo "Loading cargo..."
echo "Securing containers..."
echo "🚢 Website deployed. Nice work, dockhand!"
`;
const HELLO=`
Hello from Docker!
This message shows that your installation appears to be working correctly.

To generate this message, Docker took the following steps:
 1. The Docker client contacted the Docker daemon.
 2. The Docker daemon pulled the "hello-world" image from the Docker Hub.
 3. The Docker daemon created a new container from that image which runs the
    executable that produces the output you are currently reading.
 4. The Docker daemon streamed that output to the Docker client, which sent it
    to your terminal.`;
const PG_ERR=`Error: Database is uninitialized and superuser password is not specified.
       You must specify POSTGRES_PASSWORD to a non-empty value for the
       superuser. For example, "-e POSTGRES_PASSWORD=password" on "docker run".`;
const NGINX_HTML=`<!DOCTYPE html>
<html>
<head><title>Welcome to nginx!</title></head>
<body>
<h1>Welcome to nginx!</h1>
<p>If you see this page, the nginx web server is successfully installed and working.</p>
</body>
</html>`;

const d=c=>({t:'d',c:c,m:'rwxr-xr-x'});
const f=(x,m,sz)=>{const n={t:'f',x:x,m:m||'rw-r--r--'};if(sz)n.sz=sz;return n};
function freshFS(){
  return d({
    home:d({cadet:d({
      'welcome.txt':f(WELCOME),'.secret':f(SECRET),'.bashrc':f("alias ll='ls -l'\n"),'notes.txt':f(NOTES),'crew.txt':f(CREW),
      logs:d({'system.log':f(SYSLOG),'crane.log':f(CRANELOG)}),
      projects:d({
        webapp:d({'index.html':f(INDEX),'app.py':f(APP),'Dockerfile':f(DOCKERFILE),'deploy.sh':f(DEPLOY)}),
        legacy:d({old:d({'crate-manifest.txt':f(MANIFEST)}),'README':f('Nobody remembers what this folder is for.\n')}),
        stack:d({'docker-compose.yml':f(COMPOSE)}),
        broken:d({'Dockerfile':f(BROKEN_DOCKERFILE),'app.py':f(BROKEN_APP)})
      })
    })}),
    etc:d({hostname:f(HOST+'\n'),'os-release':f('NAME="Penguin Linux"\nVERSION="26.04 (Harbor)"\n')}),
    tmp:d({'old-cargo.log':f('2026-11-01 crate 7781 lost at sea\n')}),
    usr:d({bin:d({}),share:d({})}),
    var:d({log:d({'syslog':f('Nov 24 06:00:01 port-penguin systemd[1]: Started harbor.\n','rw-r-----',48e6),'auth.log':f('Nov 24 06:00:03 sshd: session opened for cadet\n','rw-r-----',2.1e6),'dpkg.log':f('2026-11-20 status installed docker-ce\n',null,9e5)})})
  });
}
function freshProcs(){return [
  {pid:1,user:'root',cpu:0.0,mem:0.3,cmd:'/sbin/init'},
  {pid:214,user:'root',cpu:0.0,mem:0.2,cmd:'/usr/sbin/sshd -D'},
  {pid:388,user:'root',cpu:0.4,mem:1.9,cmd:'/usr/bin/dockerd'},
  {pid:1021,user:'cadet',cpu:0.2,mem:0.8,cmd:'harbor-radio --station 16'},
  {pid:4242,user:'cadet',cpu:99.1,mem:2.3,cmd:'crane-sim --loop'},
  {pid:5150,user:'cadet',cpu:0.0,mem:0.1,cmd:'-bash'}
]}

/* ---------- State ---------- */
let S;
const fresh=()=>({fs:freshFS(),cwd:HOME,oldpwd:HOME,env:{},procs:freshProcs(),lastCode:0,
  dk:{images:[],containers:[],volumes:[],networks:[{name:'bridge',id:hex(12),driver:'bridge',subnet:'172.17',next:1},{name:'host',id:hex(12),driver:'host'},{name:'none',id:hex(12),driver:'null'}]},
  done:[],cur:0,hist:[],setup:{},unlocked:false});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.fs&&o.dk&&o.procs&&Array.isArray(o.done))return o}}catch(e){}return null}

/* ---------- Paths ---------- */
function norm(p){
  if(p===undefined||p===null)p='.';
  if(p==='~'||p.startsWith('~/'))p=HOME+p.slice(1);
  if(!p.startsWith('/'))p=S.cwd+'/'+p;
  const out=[];
  for(const s of p.split('/')){if(!s||s==='.')continue;if(s==='..')out.pop();else out.push(s)}
  return '/'+out.join('/');
}
function get(p){let n=S.fs;for(const s of norm(p).split('/').filter(Boolean)){if(n.t!=='d'||!n.c[s])return null;n=n.c[s]}return n}
function split(p){const a=norm(p);const i=a.lastIndexOf('/');return [a.slice(0,i)||'/',a.slice(i+1)]}
const base=p=>split(p)[1]||'/';
const disp=p=>p===HOME?'~':p.startsWith(HOME+'/')?'~'+p.slice(HOME.length):p;
function writeFile(p,text,append){
  const [par,name]=split(p);const dn=get(par);
  if(!dn||dn.t!=='d')return `bash: ${p}: No such file or directory`;
  const ex=dn.c[name];
  if(ex&&ex.t==='d')return `bash: ${p}: Is a directory`;
  if(ex){ex.x=append?ex.x+text:text;delete ex.sz}else dn.c[name]=f(text);
  return null;
}
function globRe(pat,ci){return new RegExp('^'+pat.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$',ci?'i':'')}
function expandGlob(pat){
  const sl=pat.lastIndexOf('/');const dirPart=sl>=0?pat.slice(0,sl+1):'';const last=pat.slice(sl+1);
  const dn=get(dirPart||'.');
  if(!dn||dn.t!=='d'||!/[*?]/.test(last))return [pat];
  const re=globRe(last);
  const m=Object.keys(dn.c).filter(n=>re.test(n)&&(last.startsWith('.')||n[0]!=='.')).sort();
  return m.length?m.map(n=>dirPart+n):[pat];
}

/* ---------- Helpers ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const R=(out,extra)=>Object.assign({out:out,code:0},extra||{});
const E=(err,code)=>({err:err,code:code||1});
function pf(args){const fl=new Set(),pos=[];let end=false;for(const a of args){if(!end&&a==='--'){end=true;continue}if(!end&&a.length>1&&a[0]==='-'&&!/^-\d+$/.test(a)){for(const ch of a.slice(1))fl.add(ch)}else pos.push(a)}return {fl,pos}}
function hex(n){let s='';for(let i=0;i<n;i++)s+='0123456789abcdef'[Math.floor(Math.random()*16)];return s}
const clone=o=>JSON.parse(JSON.stringify(o));
function size(n){if(n.t==='d')return 4096;if(n.sz)return n.sz;return new Blob([n.x]).size}

    if(ch==='$'){const m=line.slice(i+1).match(/^\{(\w+)\}|^([A-Za-z_]\w*)|^\?/);if(m){cur+=m[0]==='?'?String(S.lastCode||0):envGet(m[1]||m[2]);i+=m[0].length;continue}}

    if(ch==='"'||ch==="'"){q=ch;has=true;continue}
    if(ch===' '||ch==='\t'){push();continue}
    if(ch==='|'&&line[i+1]!=='|'){push();toks.push({op:'|'});continue}
    if(ch==='&'&&line[i+1]==='&'){push();toks.push({op:'&&'});i++;continue}

function runScript(path,ctx,needX){

  if(n.t==='d')return E(`bash: ${path}: Is a directory`,126);

function parseYaml(txt){
  const ls=txt.split('\n').map(l=>l.replace(/\s+#.*$/,'').replace(/\s+$/,'')).filter(l=>l.trim()&&!l.trim().startsWith('#'));
  let i=0;
  const scalar=v=>{v=v.trim();if(/^".*"$|^'.*'$/.test(v))return v.slice(1,-1);return v===''?null:v};
  function block(ind){
    const first=ls[i];if(!first)return null;
    if(first.trim().startsWith('- ')){const arr=[];while(i<ls.length){const l=ls[i];const li=l.search(/\S/);if(li!==ind||!l.trim().startsWith('- '))break;arr.push(scalar(l.trim().slice(2)));i++}return arr}
    const obj={};
    while(i<ls.length){
      const l=ls[i];const li=l.search(/\S/);if(li<ind)break;if(li>ind){i++;continue}
      if(l.trim().startsWith('- '))break;
      const m=l.trim().match(/^([^:]+):\s*(.*)$/);i++;if(!m)continue;
      const key=m[1].trim().replace(/^["']|["']$/g,'');
      if(m[2]!==''){obj[key]=scalar(m[2]);continue}
      const nx=ls[i];
      if(nx&&(nx.search(/\S/)>li||(nx.search(/\S/)===li&&nx.trim().startsWith('- '))))obj[key]=block(nx.search(/\S/));else obj[key]=null;
    }
    return obj;
  }
  return block(0);
}

  }
  if(sub==='ps'){
    const all=rest.includes('-a');const list=mine().filter(c=>all||c.status==='running');

  }
  if(sub==='logs'){const sv=rest.find(x=>x[0]!=='-');const list=mine().filter(c=>!sv||c.service===sv);if(sv&&!list.length)return E(`no such service: ${sv}`);return R(list.map(c=>c.logs.map(l=>`${c.service}-1  | ${l}`).join('\n')).join('\n'))}

  if(sub==='down'){

    const nn=proj+'_default';if(findNet(nn)){S.dk.networks=S.dk.networks.filter(n=>n.name!==nn);out.push(` ✔ Network ${nn}  Removed`)}

 {ch:2,title:'Lost and found',text:'Somewhere under your projects folder is an old file called crate-manifest.txt. Nobody remembers where. `find` searches through folders for you.',goal:'Find where crate-manifest.txt is hiding.',hint:'`find projects -name crate-manifest.txt`',check:c=>has(c,'find')&&c.allOut.includes('crate-manifest.txt'),learn:['find PATH -name NAME','Search folders for a file'],after:'Now that you know the path, cat it. Crate 0003 looks interesting.'},
 {ch:2,title:'Every log file',text:'`*` is a wildcard that matches anything. Combine it with find to list all files ending in .log under your home folder. Put the pattern in quotes so find gets it as-is.',goal:'List every .log file under your home folder.',hint:'`find ~ -name "*.log"`',check:c=>has(c,'find')&&c.allOut.includes('system.log')&&c.allOut.includes('crane.log'),learn:['find ~ -name "*.log"','Find files by pattern'],after:'Wildcards also work directly in the shell: ls logs/*.log'},
 {ch:2,title:'Line up the crew',text:'crew.txt is a mess. `sort` puts lines in alphabetical order.',goal:'Show crew.txt sorted alphabetically.',hint:'`sort crew.txt`',check:c=>has(c,'sort')&&c.line.includes('crew.txt'),learn:['sort FILE','Sort lines'],after:'sort -r reverses the order, and sort -n sorts numbers properly (so 10 comes after 9).'},
 {ch:2,title:'No duplicates',text:'Some crew members signed up twice. `uniq` removes repeated lines, but only when they’re next to each other. So sort first, then pipe into uniq.',goal:'Show each crew member exactly once.',hint:'`sort crew.txt | uniq` (or `sort -u crew.txt`)',check:c=>c.line.includes('crew.txt')&&(has(c,'uniq')||seg(c,a=>a[0]==='sort'&&flag(a,'u'))),learn:['sort | uniq','Remove duplicate lines'],after:'uniq -c also counts how many times each line appeared. You’ll need that later.'},
 /* 4. Permissions & scripts */
 {ch:3,title:'Read the fine print',text:'Every file has permissions: who can read (r), write (w) and execute (x) it. A long listing shows them in the first column.',goal:'Show a long listing of projects/webapp.',hint:'`ls -l projects/webapp`',check:c=>seg(c,a=>(a[0]==='ls'&&flag(a,'l'))||a[0]==='ll'),learn:['ls -l','Show permissions, owner, size, date'],after:'rw-r--r-- reads as three groups: you can read+write, your group can read, everyone else can read.'},
 {ch:3,title:'Permission to launch',text:'In projects/webapp, try running the deploy script with `./deploy.sh`. It will refuse, because it lacks the x (execute) permission. `chmod +x` adds it.',goal:'Make deploy.sh executable and run it.',hint:'`cd ~/projects/webapp`, then `chmod +x deploy.sh`, then `./deploy.sh`',check:c=>c.ranExec==='deploy.sh',learn:['chmod +x FILE','Allow a file to run'],after:'The ./ means “the file right here”. Linux doesn’t run files from the current folder unless you say so.'},
 {ch:3,title:'Top secret',text:'notes.txt holds shipment details. Right now anyone on the server can read it. Permissions can also be written as three digits: 4 = read, 2 = write, 1 = execute, added up for you, your group and everyone else.',goal:'Make ~/notes.txt readable and writable by you only (rw-------).',hint:'`chmod 600 ~/notes.txt` (6 = 4+2 for you, 0 for group, 0 for others)',check:()=>{const n=node(HOME+'/notes.txt');return !!n&&n.m==='rw-------'},learn:['chmod 600 FILE','Only you can read and write'],after:'SSH keys must be 600, or ssh refuses to use them. Now you know why.'},
 {ch:3,title:'Write your own script',text:'A script is just a text file full of commands. Create hello.sh in your home folder containing an echo that prints Ahoy, make it executable, and run it.',goal:'Create and run a script that prints Ahoy.',hint:'`cd ~`, `echo "echo Ahoy" > hello.sh`, `chmod +x hello.sh`, `./hello.sh`',check:c=>c.ranExec==='hello.sh'&&/ahoy/i.test(c.allOut),learn:['./script.sh','Run your own script'],after:'Real scripts usually start with #!/bin/bash on the first line, telling the system which program runs them.'},
 {ch:3,title:'Remember this',text:'Variables store values for later. Set one with `NAME=value` (no spaces around =), and read it back with `$NAME`.',goal:'Store your name in a variable called CREW, then print it with echo.',hint:'`CREW=Marina` then `echo $CREW` (two separate commands)',check:c=>has(c,'echo')&&c.line.includes('$CREW')&&!!S.env.CREW,learn:['NAME=value / $NAME','Set and use a variable'],after:'Try echo $HOME and echo $USER too. Docker uses variables like these to configure containers.'},
 {ch:3,title:'Pack it up',text:'A tar archive bundles many files into one, and the z flag compresses it. The flags read as: c create, z gzip, f file name next.',goal:'Pack the backups folder into backups.tar.gz in your home folder.',hint:'`cd ~` then `tar -czf backups.tar.gz backups`',check:()=>{const n=node(HOME+'/backups.tar.gz');return !!n&&n.t==='f'&&n.x.startsWith('PPTAR')},learn:['tar -czf A.tar.gz DIR','Create a compressed archive'],after:'Archives are how you back up, download and ship bundles of files.'},
 {ch:3,title:'Peek inside',text:'You can list what’s in an archive without unpacking it. Swap c (create) for t (list).',goal:'List the contents of backups.tar.gz.',hint:'`tar -tzf backups.tar.gz`',check:c=>seg(c,a=>a[0]==='tar'&&a.some(x=>/^-?[a-z]*t[a-z]*$/.test(x)&&!x.endsWith('.gz'))),learn:['tar -tzf A.tar.gz','List an archive’s contents'],after:'Always peek before you unpack something someone sent you.'},
 {ch:3,title:'Unpack somewhere else',text:'x extracts. Normally files land in the current folder, but -C picks a different destination.',goal:'Extract backups.tar.gz into /tmp.',hint:'`tar -xzf backups.tar.gz -C /tmp`',check:()=>!!node('/tmp/backups/notes.txt'),learn:['tar -xzf A.tar.gz -C DIR','Extract an archive'],after:'Memory trick: eXtract Ze Files, Create Ze File, Tell me what’s in Ze File.'},
 /* 5. Processes & system */
 {ch:4,title:'Who’s running?',text:'Every running program is a process with a number, its PID. `ps` lists your processes. `ps aux` lists everyone’s.',goal:'List the running processes.',hint:'`ps` or `ps aux`',check:c=>has(c,'ps'),learn:['ps / ps aux','List processes'],after:'PID 1 is always the very first process, started when the machine boots.'},
 {ch:4,title:'The CPU hog',text:'The server feels sluggish. `top` lists processes sorted by how much CPU they use.',goal:'Find out which process is eating the CPU.',hint:'`top`',check:c=>has(c,'top'),learn:['top','See which processes use the most CPU'],after:'crane-sim is stuck in a loop at 99% CPU. Note its PID.'},
 {ch:4,title:'Stop the loop',text:'`kill` followed by a PID asks a process to stop.',goal:'Stop crane-sim.',hint:'`kill 4242` (the PID you saw in top or ps)',check:()=>!S.procs.some(p=>p.pid===4242),learn:['kill PID','Ask a process to stop'],after:'Run top again: the load is back to normal.'},
 {ch:4,title:'The stubborn one',text:'BWAAAMP. A fog-horn process just started and it won’t stop blaring. A plain kill politely asks a process to quit, and this one ignores polite requests.',goal:'Force fog-horn to stop.',hint:'Find its PID with `ps`, then `kill -9 PID` (9 is SIGKILL, which can’t be ignored)',setup:()=>{if(!S.procs.some(p=>p.cmd.startsWith('fog-horn')))S.procs.push({pid:4343,user:'cadet',cpu:12.5,mem:0.6,cmd:'fog-horn --blast',stubborn:true})},alert:'📯 BWAAAMP. Something called fog-horn just started on the server.',check:()=>S.setup[35]&&!S.procs.some(p=>p.cmd.startsWith('fog-horn')),learn:['kill -9 PID','Force a process to stop'],after:'Use -9 as a last resort: the process gets no chance to save its work or clean up.'},
 {ch:4,title:'Disk check',text:'A full disk breaks almost everything. `df` shows how full each disk is, and `-h` makes the numbers human-readable (G for gigabytes).',goal:'Check how full the disks are.',hint:'`df -h`',check:c=>has(c,'df'),learn:['df -h','Show disk usage'],after:'Use% is the number to watch. Anything over 90% needs attention.'},
 {ch:4,title:'What takes space?',text:'df tells you a disk is full. `du` tells you what’s filling it. `-s` gives one total, `-h` makes it readable.',goal:'Check how much space your home folder uses.',hint:'`du -sh ~`',check:c=>has(c,'du'),learn:['du -sh PATH','Show how much space a folder uses'],after:'du -sh * shows the size of every item in the current folder, which is great for hunting down space hogs.'},
 /* 6. Docker basics */
 {ch:5,title:'Your first container',text:'Time for Docker. A container is like a shipping container for software: an app plus everything it needs, packed in one box that runs the same anywhere. Run the classic test image.',goal:'Run the hello-world container.',hint:'`docker run hello-world`',check:()=>S.dk.containers.some(x=>x.repo==='hello-world'),learn:['docker run IMAGE','Start a container'],after:'Docker didn’t have the image yet, so it downloaded (pulled) it from Docker Hub first, then ran it.'},
 {ch:5,title:'Stock the yard',text:'Images are the packed recipes that containers start from. Download the nginx web server image ahead of time.',goal:'Pull the nginx image.',hint:'`docker pull nginx`',check:()=>S.dk.images.some(m=>m.repo==='nginx'),learn:['docker pull IMAGE','Download an image'],after:'An image is the recipe. A container is one running copy of it. You can run many containers from one image.'},
 {ch:5,title:'Check the inventory',text:'See which images are stored on this machine.',goal:'List your images.',hint:'`docker images`',check:c=>dk(c,'images')||dk(c,'image','ls'),learn:['docker images','List downloaded images'],after:'The IMAGE ID identifies an image even if it has several names.'},
 {ch:5,title:'Run it in the background',text:'Start nginx as a background web server. `-d` runs it detached, `--name` names it, and `-p 8080:80` connects port 8080 on your machine to port 80 inside the container.',goal:'Run nginx in the background, named web, on port 8080.',hint:'`docker run -d --name web -p 8080:80 nginx`',check:()=>S.dk.containers.some(x=>x.name==='web'&&x.repo==='nginx'&&x.status==='running'&&x.ports.some(p=>p.startsWith('8080:'))),learn:['docker run -d -p H:C --name N','Background container with a port'],after:'Your web server is up and running.'},
 {ch:5,title:'What’s running?',text:'List the containers that are running right now.',goal:'Show running containers.',hint:'`docker ps`',check:c=>dk(c,'ps')||dk(c,'container','ls'),learn:['docker ps','List running containers'],after:'Look at the PORTS column: 0.0.0.0:8080->80/tcp is the mapping you asked for.'},
 {ch:5,title:'Pay a visit',text:'Your web server is published on port 8080. `curl` fetches a web page right in the terminal.',goal:'Fetch the page served on port 8080.',hint:'`curl localhost:8080`',check:c=>has(c,'curl')&&c.allOut.includes('Welcome to nginx'),learn:['curl localhost:PORT','Fetch a web page from the terminal'],after:'localhost means “this machine”. The request went to port 8080, and Docker forwarded it to port 80 inside the container.'},
 {ch:5,title:'Read the logs',text:'When a container misbehaves, its logs are the first place to look.',goal:'Show the logs of the web container.',hint:'`docker logs web`',check:c=>dk(c,'logs'),learn:['docker logs NAME','Show a container’s output'],after:'See the GET line at the bottom? That’s your curl visit.'},
 {ch:5,title:'Step inside',text:'`docker exec` runs a command inside a running container. Peek at the files nginx serves from /usr/share/nginx/html.',goal:'List /usr/share/nginx/html inside web.',hint:'`docker exec web ls /usr/share/nginx/html`',check:c=>dk(c,'exec'),learn:['docker exec NAME CMD','Run a command inside a container'],after:'On a real machine, docker exec -it web sh opens a full shell inside the container.'},
 {ch:5,title:'Unload the ship',text:'Done with nginx. A container must be stopped before it can be removed.',goal:'Stop and remove the web container.',hint:'`docker stop web` then `docker rm web` (or both at once: `docker stop web && docker rm web`)',check:()=>!ct('web'),learn:['docker stop / rm NAME','Stop, then remove a container'],after:'docker rm -f web stops and removes in one step.'},
 {ch:5,title:'Build your own',text:'The webapp folder has a Dockerfile: step-by-step instructions for packing the app into an image. Read it, then build it. The `.` means “use this folder”.',goal:'Build an image called myapp from ~/projects/webapp.',hint:'`cd ~/projects/webapp`, `cat Dockerfile`, then `docker build -t myapp .`',check:()=>S.dk.images.some(m=>m.repo==='myapp'),learn:['docker build -t NAME .','Build an image from a Dockerfile'],after:'Each line of a Dockerfile is a step. Docker caches the steps, so rebuilds are fast when little has changed.'},
 {ch:5,title:'Launch day',text:'Your app listens on port 5000 inside the container. Run your very own image in the background and publish that port.',goal:'Run myapp in the background on port 5000, then visit it.',hint:'`docker run -d --name myapp -p 5000:5000 myapp`, then `curl localhost:5000`',check:()=>S.dk.containers.some(x=>x.repo==='myapp'&&x.status==='running'),learn:['docker run your image','Ship your own app'],after:'You built and shipped your own app. Try curl localhost:5000 if you haven’t yet.'},
 /* 7. Docker networks & data */
 {ch:6,title:'The full picture',text:'Containers that finished or crashed don’t vanish. They stay around, stopped, until you remove them.',goal:'List every container, including stopped ones.',hint:'`docker ps -a`',check:c=>seg(c,a=>a[0]==='docker'&&a[1]==='ps'&&(a.includes('-a')||a.includes('--all'))),learn:['docker ps -a','List all containers, stopped too'],after:'The hello-world container from earlier is still there, stopped.'},
 {ch:6,title:'Sweep the deck',text:'That old hello-world container is just taking up space. Remove it, using the name or ID from the list.',goal:'Remove the stopped hello-world container.',hint:'`docker ps -a` to find its name, then `docker rm NAME` (or `docker container prune -f` removes every stopped container)',check:()=>!S.dk.containers.some(x=>x.repo==='hello-world'),learn:['docker rm NAME','Remove a stopped container'],after:'Docker gives unnamed containers random names like jolly_otter. Naming them yourself with --name keeps things tidy.'},
 {ch:6,title:'Clear the shelf',text:'You won’t need the hello-world image again either. Removing an image uses a different command from removing a container.',goal:'Delete the hello-world image.',hint:'`docker rmi hello-world`',check:()=>!S.dk.images.some(m=>m.repo==='hello-world'),learn:['docker rmi IMAGE','Remove an image'],after:'Docker refuses to delete an image while any container (even a stopped one) still uses it.'},
 {ch:6,title:'A database appears',text:'The harbor needs a database. Start a postgres container in the background, named db.',goal:'Start postgres in the background with the name db.',hint:'`docker run -d --name db postgres`',check:()=>{const x=ct('db');return !!x&&x.repo==='postgres'},learn:['docker run -d --name db postgres','Start a database'],after:'Docker printed an ID, so it started… but is it still running? Check docker ps.'},
 {ch:6,title:'Why did it stop?',text:'db isn’t in docker ps anymore. A container that stops right away almost always explains why in its logs.',goal:'Read db’s logs to find out why it stopped.',hint:'`docker logs db`',check:c=>seg(c,a=>a[0]==='docker'&&a[1]==='logs'&&a.includes('db')),learn:['docker ps -a + docker logs','Diagnose a crashed container'],after:'Postgres refuses to start without a password, passed in as an environment variable.'},
 {ch:6,title:'Fix the database',text:'Environment variables configure containers. Pass one with `-e NAME=value`. You can’t change a container’s settings after it’s created, so remove the broken db and start a new one.',goal:'Get a postgres container named db running, with a password.',hint:'`docker rm db` then `docker run -d --name db -e POSTGRES_PASSWORD=secret postgres`',check:()=>running('db')&&ct('db').repo==='postgres',learn:['docker run -e KEY=value','Pass settings into a container'],after:'Run docker logs db again: “ready to accept connections”.'},
 {ch:6,title:'Where’s the database?',text:'Every container gets its own IP address. `docker inspect` shows everything Docker knows about a container as JSON, including that.',goal:'Find db’s IP address.',hint:'`docker inspect db` and look for IPAddress, or the short way: `docker inspect -f "{{.NetworkSettings.IPAddress}}" db`',check:c=>seg(c,a=>a[0]==='docker'&&a[1]==='inspect'&&a.includes('db'))&&/172\.\d+\.0\.\d+/.test(c.allOut),learn:['docker inspect NAME','See every detail of a container'],after:'IPs can change when containers restart, which is why you’ll connect containers by name instead in a moment.'},
 {ch:6,title:'Safe storage',text:'Containers are disposable: remove one and every file inside it is gone. Volumes store data outside the container, so it survives.',goal:'Create a volume called harbor-data.',hint:'`docker volume create harbor-data`, then `docker volume ls` to check',check:()=>S.dk.volumes.some(v=>v.name==='harbor-data'),learn:['docker volume create NAME','Create persistent storage'],after:'Databases and anything else that saves data should always use a volume.'},
 {ch:6,title:'Mount the volume',text:'`-v VOLUME:/path` plugs a volume into a container at a folder. Redis saves its data in /data.',goal:'Run redis in the background, named cache, with harbor-data mounted at /data.',hint:'`docker run -d --name cache -v harbor-data:/data redis`',check:()=>running('cache')&&ct('cache').repo==='redis'&&ct('cache').mounts.some(m=>m.name==='harbor-data'&&m.dst==='/data'),learn:['docker run -v VOL:/path','Mount a volume'],after:'Now you could delete cache and start a new one with the same volume, and the data would still be there. Try docker exec cache redis-cli ping too.'},
 {ch:6,title:'A private network',text:'On Docker’s default network, containers can’t find each other by name. Your own network fixes that.',goal:'Create a network called harbor-net.',hint:'`docker network create harbor-net`, then `docker network ls`',check:()=>!!findNet('harbor-net'),learn:['docker network create NAME','Create a network'],after:'Containers on the same user-made network can reach each other by container name, with no IPs needed.'},
 {ch:6,title:'Plug it in',text:'cache is already running. You can connect a running container to another network without restarting it.',goal:'Connect cache to harbor-net.',hint:'`docker network connect harbor-net cache`',check:()=>{const x=ct('cache');return !!x&&!!x.networks['harbor-net']},learn:['docker network connect NET NAME','Add a container to a network'],after:'cache is now on two networks: the default bridge and harbor-net.'},
 {ch:6,title:'Can you hear me?',text:'Prove the network works. Start a throwaway alpine container on harbor-net that pings cache once. `--rm` removes it automatically when it’s done.',goal:'Ping cache by name from a temporary container on harbor-net.',hint:'`docker run --rm --network harbor-net alpine ping -c 1 cache`',check:c=>dk(c,'run')&&c.allOut.includes('packets received'),learn:['docker run --rm --network NET','Throwaway container on a network'],after:'Try the same without --network harbor-net and you’ll get “bad address”. That’s why custom networks matter.'},
 /* 8. Compose & challenges */
 {ch:7,title:'One file to rule them all',text:'Starting containers one by one gets tedious. Docker Compose describes a whole stack in a single YAML file. Go to ~/projects/stack and read docker-compose.yml.',goal:'Read the stack’s docker-compose.yml.',hint:'`cd ~/projects/stack` then `cat docker-compose.yml`',check:c=>seg(c,a=>a[0]==='cat'&&a.some(x=>x.endsWith('docker-compose.yml'))),learn:['docker-compose.yml','Describe a whole stack in one file'],after:'Two services: web (nginx) and cache (redis), with a volume for the cache. depends_on makes cache start first.'},
 {ch:7,title:'Raise the stack',text:'One command creates the network, the volume and every container in the file. Remember the flag that keeps things running in the background.',goal:'Start the whole stack in the background.',hint:'`docker compose up -d` (from inside ~/projects/stack)',check:()=>running('stack-web-1')&&running('stack-cache-1'),learn:['docker compose up -d','Start a whole stack'],after:'Compose named everything after the folder: stack-web-1, stack-cache-1, stack_default. Try curl localhost:8081.'},
 {ch:7,title:'Stack status',text:'docker ps shows every container on the machine. Compose has its own version that shows only this stack.',goal:'List only this stack’s containers.',hint:'`docker compose ps`',check:c=>dk(c,'compose','ps'),learn:['docker compose ps','List a stack’s containers'],after:'docker compose logs shows all services’ output together, labeled by service.'},
 {ch:7,title:'Strike the stack',text:'When you’re done, Compose can tear everything down as easily as it built it.',goal:'Stop and remove the stack’s containers and network in one command.',hint:'`docker compose down`',check:c=>dk(c,'compose','down')&&!S.dk.containers.some(x=>x.project==='stack'),learn:['docker compose down','Remove a whole stack'],after:'The volume survives a down on purpose, so your data is safe. down -v deletes volumes too.'},
 {ch:7,title:'Challenge: squatter',text:'📟 Incident: the harbor site must go live on host port 8080, as a container named harbor running your myapp image (which listens on 5000 inside). Something is already sitting on that port. You’re on your own now.',goal:'Get harbor running myapp on host port 8080.',hint:'`docker ps` shows squatter on 8080. `docker rm -f squatter`, then `docker run -d --name harbor -p 8080:5000 myapp`',setup:()=>{if(!findImg('nginx'))pull('nginx');if(!ct('squatter')){const {c}=makeContainer({img:findImg('nginx'),name:'squatter',ports:S.dk.containers.some(x=>x.status==='running'&&x.ports.some(p=>p.startsWith('8080:')))?[]:['8080:80'],env:[],mounts:[],cmd:[],det:true});S.dk.containers.push(c)}},alert:'📟 Pager: “Port 8080 is serving the wrong site. Find out what’s on it.”',check:()=>{const x=ct('harbor');return !!x&&x.status==='running'&&x.repo==='myapp'&&x.ports.some(p=>p.startsWith('8080:'))},learn:['Bind … port is already allocated','Find and free a busy port'],after:'Two containers can never publish the same host port at once. docker ps is always the first place to look.'},
 {ch:7,title:'Challenge: broken build',text:'Build an image called fixed from ~/projects/broken. The build fails. Read the error carefully, fix the Dockerfile, and build again. There’s no text editor here, so you’ll need a command that edits files in place.',goal:'Build the fixed image successfully.',hint:'The error points at line 2: FORM should be FROM. `cd ~/projects/broken`, `sed -i \'s/FORM/FROM/\' Dockerfile`, `docker build -t fixed .`',check:()=>S.dk.images.some(m=>m.repo==='fixed'),learn:['sed -i \'s/OLD/NEW/\' FILE','Edit a file in place'],after:'Build errors always say which line broke. Reading the error closely solves most problems.'},
 {ch:7,title:'Challenge: disk full',text:'📟 The server’s disk is almost full and services are starting to fail. Find what’s eating the space under /var/log and get rid of it.',goal:'Free up the disk.',hint:'`df -h` confirms it, `du -sh /var/log/*` finds the culprit, `rm /var/log/crane-debug.log` fixes it',setup:()=>{if(!get('/var/log/crane-debug.log'))get('/var/log').c['crane-debug.log']=f('DEBUG crane-2 tick\nDEBUG crane-2 tick\nDEBUG crane-2 tick\n','rw-r--r--',16.4*1024**3)},alert:'📟 Pager: “Disk usage at 95% on port-penguin.”',check:()=>{const n=get('/var/log/crane-debug.log');return !n||!n.sz},learn:['df -h → du -sh * → rm','Track down what fills a disk'],after:'Somebody left debug logging switched on. On real servers, log rotation stops this from happening.'},
 {ch:7,title:'Challenge: log detective',text:'Which log level (INFO, WARN or ERROR) appears most often in logs/system.log? Answer it with one pipeline that counts every level, most common first. Hint: the level is the third word on each line.',goal:'Count each log level in a single pipeline.',hint:'`awk \'{print $3}\' logs/system.log | sort | uniq -c | sort -rn` (from your home folder)',check:c=>seg(c,a=>a[0]==='uniq'&&flag(a,'c'))&&has(c,'sort')&&(has(c,'awk')||has(c,'cut')),learn:['awk | sort | uniq -c | sort -rn','Count and rank anything'],after:'This exact pipeline is how people find the most common errors, IPs or URLs in real logs.'},
 {ch:7,title:'Final mission: ship 1.0',text:'Time to ship a proper release. Give myapp a version tag of 1.0, then run exactly that version in the background as app-prod, on harbor-net, reachable on host port 9000.',goal:'Run myapp:1.0 as app-prod on harbor-net, on port 9000.',hint:'`docker tag myapp myapp:1.0`, then `docker run -d --name app-prod --network harbor-net -p 9000:5000 myapp:1.0`',check:()=>{const x=ct('app-prod');return !!x&&x.status==='running'&&x.image==='myapp:1.0'&&!!x.networks['harbor-net']&&x.ports.some(p=>p.startsWith('9000:'))},learn:['docker tag IMG IMG:1.0','Version your images'],after:'Tagged, networked, published. That’s a real deployment.'}
];
const RANKS=[[0,'Deckhand'],[6,'Dockhand'],[14,'Cargo clerk'],[24,'Crane operator'],[32,'Harbor pilot'],[38,'First mate'],[49,'Captain'],[61,'Port captain'],[70,'Harbor master']];
const rankFor=n=>RANKS.filter(r=>n>=r[0]).pop()[1];

/* ---------- SHA-256 (for the instructor password) ---------- */
function sha256(str){
  const ascii=unescape(encodeURIComponent(str));
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));const mp=Math.pow,maxWord=mp(2,32);let result='';const words=[];const bitLen=ascii.length*8;
  let hash=[],k=[],pc=0;const isC={};
  for(let cand=2;pc<64;cand++){if(!isC[cand]){for(let i=0;i<313;i+=cand)isC[i]=cand;hash[pc]=(mp(cand,.5)*maxWord)|0;k[pc++]=(mp(cand,1/3)*maxWord)|0}}
  let s=ascii+'\x80';while(s.length%64-56)s+='\x00';
  for(let i=0;i<s.length;i++){const j=s.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
  words[words.length]=((bitLen/maxWord)|0);words[words.length]=bitLen;
  for(let j=0;j<words.length;){const w=words.slice(j,j+=16);const old=hash;hash=hash.slice(0,8);
    for(let i=0;i<64;i++){const w15=w[i-15],w2=w[i-2];const a=hash[0],e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
    for(let i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
  for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=(b<16?'0':'')+b.toString(16)}
  return result;
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const out=$('out'),screen=$('screen'),inp=$('cmd'),promptEl=$('prompt');
function line(html,cls){const el=document.createElement('div');el.className='ln '+(cls||'');el.innerHTML=html;out.appendChild(el)}
function print(t,cls){if(t===undefined||t===null||t==='')return;line(esc(String(t).replace(/\n$/,'')),cls)}
const promptHTML=()=>`<span class="pu">cadet@${HOST}</span>:<span class="pp">${esc(disp(S.cwd))}</span>$`;
function renderPrompt(){promptEl.innerHTML=promptHTML()}
function md(s,click){return esc(s).replace(/`([^`]+)`/g,(_,c)=>click?`<button type="button" class="chip" data-ins="${c.replace(/"/g,'&quot;')}">${c}</button>`:`<code>${c}</code>`)}
function bottom(){screen.scrollTop=screen.scrollHeight}

function activate(){
  const m=M[S.cur];
  if(m&&m.setup&&!S.setup[S.cur]){m.setup();S.setup[S.cur]=true;if(m.alert)line(esc(m.alert),'sys alert')}
}

let landIdx=-1;
function renderPanel(){
  const n=S.done.length;
  $('rankName').textContent=rankFor(n);
  $('xp').textContent=`${n*10} XP, ${n} of ${M.length} tasks`;
  $('lockBtn').hidden=!S.unlocked;
  const mEl=$('mission');
  if(S.cur>=M.length){
    mEl.style.setProperty('--cc','var(--c8)');
    mEl.innerHTML=`<div class="meta"><b>${n===M.length?'All tasks done':'End of the logbook'}</b><span>${n} of ${M.length}</span></div><h2>${n===M.length?'You’re the harbor master':'You reached the end'}</h2><p>You navigated a Linux file system, searched and transformed text, managed permissions, processes and disks, then built, networked and shipped containers with Docker and Compose.</p><p>For the real thing, install Docker on your own computer and try these same commands. For more Linux practice, the free OverTheWire Bandit wargame is a great next step.</p><div class="actions"><button type="button" class="btn primary" id="again">Play again</button></div>`;
    $('again').onclick=resetAll;
  }else{
    const m=M[S.cur];const ch=CH[m.ch];
    mEl.style.setProperty('--cc',`var(${ch.col})`);
    const actions=S.unlocked
      ?`<button type="button" class="btn primary" id="hintBtn">Show hint</button><button type="button" class="btn" id="skipBtn">Skip task</button>`
      :`<button type="button" class="btn" id="unlockBtn">Unlock hints</button>`;
    mEl.innerHTML=`<div class="meta"><b>${esc(ch.name)}</b><span>Task ${S.cur+1} of ${M.length}</span></div><h2>${esc(m.title)}</h2><p>${md(m.text)}</p><div class="goal">${md(m.goal)}</div>`+
      (S.unlocked?`<div class="hint" id="hintBox" hidden>${md(m.hint,true)}<br><small style="color:var(--muted)">Tap a command to put it in the terminal.</small></div>`:'')+
      `<form class="unlock" id="unlockForm" hidden><label for="pw">Instructor password</label><div class="pwrow"><input id="pw" type="password" autocomplete="off"><button type="submit" class="btn primary">Unlock</button></div><p id="pwMsg" role="alert"></p></form>`+
      `<div class="actions">${actions}</div>`;
    if(S.unlocked){
      $('hintBtn').onclick=()=>{const h=$('hintBox');h.hidden=!h.hidden;$('hintBtn').textContent=h.hidden?'Show hint':'Hide hint'};
      $('skipBtn').onclick=()=>{S.cur++;activate();save();renderPanel();print(`Skipped. Next: ${M[S.cur]?M[S.cur].title:'end of the logbook'}`,'dim');bottom();inp.focus()};
    }else{
      $('unlockBtn').onclick=()=>{const f=$('unlockForm');f.hidden=!f.hidden;if(!f.hidden)$('pw').focus()};
      $('unlockForm').onsubmit=e=>{e.preventDefault();const v=$('pw').value;if(sha256(v)===HINT_HASH){S.unlocked=true;save();renderPanel();print('Hints unlocked. You can also skip tasks and jump between them now.','ok');bottom()}else{$('pwMsg').textContent='That password isn’t right.';$('pw').select()}};
    }
  }
  const y=$('yard');
  y.innerHTML='<h3>Container yard</h3>'+CH.map((ch,ci)=>`<div class="row" style="--cc:var(${ch.col})"><span>${esc(ch.name)}</span><div class="boxes">${M.map((m,i)=>{if(m.ch!==ci)return '';const cls=`box${S.done.includes(i)?' done':''}${i===S.cur?' cur':''}${i===landIdx?' land':''}`;const lbl=`Task ${i+1}: ${esc(m.title)}${S.done.includes(i)?', done':''}`;return S.unlocked?`<button type="button" class="${cls}" data-go="${i}" title="${lbl}" aria-label="${lbl}"></button>`:`<span class="${cls}" title="${lbl}" role="img" aria-label="${lbl}"></span>`}).join('')}</div></div>`).join('')+`<small>Each finished task lands a container.${S.unlocked?' Click any box to jump to that task.':''}</small>`;
  landIdx=-1;
  const learned=S.done.slice().sort((a,b)=>a-b).map(i=>M[i].learn);
  const L=$('learned');const open=L.open;
  L.innerHTML=`<summary>Commands you’ve learned (${learned.length})</summary>`+(learned.length?`<dl>${learned.map(l=>`<dt><code>${esc(l[0])}</code></dt><dd>${esc(l[1])}</dd>`).join('')}</dl>`:'<p style="margin:10px 0 0;color:var(--muted);font-size:14.5px">Finish a task and its command shows up here as a cheat sheet.</p>');
  L.open=open;
}

function checkMissions(ctx){
  let guard=0;
  while(S.cur<M.length&&guard++<5){
    const m=M[S.cur];let ok=false;try{ok=m.check(ctx)}catch(e){}
    if(!ok)break;
    const before=rankFor(S.done.length);
    if(!S.done.includes(S.cur))S.done.push(S.cur);
    landIdx=S.cur;
    line(`<span class="ok">✓ ${esc(m.title)}</span>  <span class="dim">+10 XP</span>\n<span class="dim">${esc(m.after)}</span>`,'sys');
    const after=rankFor(S.done.length);
    if(after!==before)line(`<span class="pu">Promoted to ${esc(after)}!</span>`,'sys big');
    const prevCh=m.ch;
    S.cur++;
    while(S.cur<M.length&&S.done.includes(S.cur))S.cur++;
    if(S.cur<M.length){
      if(M[S.cur].ch!==prevCh)line(`<span class="pu">New chapter: ${esc(CH[M[S.cur].ch].name)}</span>`,'sys big');
      line(`<span class="dim">Next task:</span> ${esc(M[S.cur].title)}`);
      activate();
    }else if(S.done.length>=M.length)line(`<span class="pu">🚢 All 70 containers are in the yard. You’re the harbor master!</span>\n<span class="dim">Keep exploring freely: everything still works.</span>`,'sys big');
  }
}

function execute(lineText){
  line(promptHTML()+' '+esc(lineText),'cmdl');
  const t=lineText.trim();
  if(!t){bottom();return}
  S.hist.push(t);if(S.hist.length>300)S.hist.shift();
  const ctx={line:t,segs:[],ranExec:null,depth:0,allOut:''};
  const raw=t;
  const toks=tokenizeChains(raw);
  if(toks.err){print('syntax error: '+toks.err,'err');S.lastCode=2}
  else{
    for(const ch of toks.chains){
      if(ch.cond&&S.lastCode!==0)break;
      const tk=tokenize(ch.text);
      if(tk.err){print('syntax error: '+tk.err,'err');S.lastCode=2;break}
      if(!tk.length)continue;
      let res;try{res=runPipeline(tk,ctx)}catch(e){res=E('Something went wrong running that: '+e.message)}
      if(res.clear)out.innerHTML='';
      if(res.html!==undefined&&res.html!=='')line(res.html);else print(res.out);
      print(res.err,'err');
      ctx.allOut+=(res.out||'')+'\n';
      S.lastCode=res.code||0;
    }
  }
  checkMissions(ctx);
  save();renderPrompt();renderPanel();bottom();
}
/* Split a line on && and ; outside quotes, so variables set earlier in the line are visible later */
function tokenizeChains(line){
  const chains=[];let cur='',q=null,cond=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(q){if(ch===q)q=null;cur+=ch;continue}
    if(ch==='"'||ch==="'"){q=ch;cur+=ch;continue}
    if(ch==='&'&&line[i+1]==='&'){chains.push({text:cur,cond});cur='';cond=true;i++;continue}
    if(ch===';'){chains.push({text:cur,cond});cur='';cond=false;continue}
    cur+=ch}
  if(q)return {err:'a quote was opened but never closed'};
  chains.push({text:cur,cond});
  return {chains:chains.filter(c=>c.text.trim())};
}

/* History and completion */
let hi=-1,draft='';
function histMove(dir){
  if(!S.hist.length)return;
  if(hi===-1){draft=inp.value;hi=S.hist.length}
  hi=Math.max(0,Math.min(S.hist.length,hi+dir));
  inp.value=hi===S.hist.length?draft:S.hist[hi];
  if(hi===S.hist.length)hi=-1;
  requestAnimationFrame(()=>inp.setSelectionRange(inp.value.length,inp.value.length));
}
const DSUB=['run','ps','images','pull','build','tag','stop','start','restart','rm','rmi','logs','exec','inspect','stats','volume','network','system','compose','help','version'];
function complete(){
  const v=inp.value,pos=inp.selectionStart??v.length;const before=v.slice(0,pos);
  const word=(before.match(/(\S*)$/)||['',''])[1];const start=pos-word.length;
  const prev=before.slice(0,start).trim().split(/\s+/).filter(Boolean);
  let lastSep=-1;prev.forEach((w,i)=>{if(w==='|'||w==='&&'||w===';')lastSep=i});const words=prev.slice(lastSep+1);
  let cands=[],dirPart='';
  if(words.length===0)cands=Object.keys(CMDS).filter(c=>c.startsWith(word)).sort().map(c=>c+' ');
  else if(words[0]==='docker'&&words.length===1)cands=DSUB.filter(c=>c.startsWith(word)).map(c=>c+' ');
  else if(words[0]==='docker'&&words[1]==='compose'&&words.length===2)cands=['up','ps','logs','down','stop','start'].filter(c=>c.startsWith(word)).map(c=>c+' ');
  else if(words[0]==='docker'&&words[1]==='volume'&&words.length===2)cands=['create','ls','rm','inspect'].filter(c=>c.startsWith(word)).map(c=>c+' ');
  else if(words[0]==='docker'&&words[1]==='network'&&words.length===2)cands=['create','ls','rm','inspect','connect','disconnect'].filter(c=>c.startsWith(word)).map(c=>c+' ');
  else if(words[0]==='docker'&&['stop','start','restart','rm','logs','exec','inspect','kill'].includes(words[1])&&!word.includes('/'))cands=S.dk.containers.map(c=>c.name).filter(c=>c.startsWith(word)).map(c=>c+' ');
  else if(words[0]==='docker'&&['rmi','run','tag'].includes(words[1])&&!word.includes('/')&&word[0]!=='-')cands=Array.from(new Set(S.dk.images.map(imgName).concat(words[1]==='run'?Object.keys(REG):[]))).filter(c=>c.startsWith(word)).map(c=>c+' ');
  else if(words[0]==='kill')cands=S.procs.map(p=>String(p.pid)).filter(c=>c.startsWith(word)).map(c=>c+' ');
  else{
    const sl=word.lastIndexOf('/');dirPart=sl>=0?word.slice(0,sl+1):'';const pre=word.slice(sl+1);
    const dn=get(dirPart||'.');
    if(dn&&dn.t==='d')cands=Object.keys(dn.c).filter(n=>n.startsWith(pre)&&(pre.startsWith('.')||n[0]!=='.')).sort().map(n=>dirPart+n+(dn.c[n].t==='d'?'/':' '));
  }
  if(!cands.length)return;
  const put=s=>{inp.value=v.slice(0,start)+s+v.slice(pos);const c=start+s.length;inp.setSelectionRange(c,c)};
  if(cands.length===1){put(cands[0]);return}
  let lcp=cands[0];for(const c of cands)while(!c.startsWith(lcp))lcp=lcp.slice(0,-1);
  if(lcp.length>word.length){put(lcp);return}
  line(promptHTML()+' '+esc(v),'cmdl');
  print(cands.map(c=>c.slice(dirPart.length).trim()).join('  '),'dim');bottom();
}
function insertText(s){const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+s+inp.value.slice(inp.selectionEnd??p);inp.setSelectionRange(p+s.length,p+s.length);inp.focus()}

inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();const v=inp.value;inp.value='';hi=-1;execute(v)}
  else if(e.key==='ArrowUp'){e.preventDefault();histMove(-1)}
  else if(e.key==='ArrowDown'){e.preventDefault();histMove(1)}
  else if(e.key==='Tab'){e.preventDefault();complete()}
  else if(e.ctrlKey&&(e.key==='l'||e.key==='L')){e.preventDefault();out.innerHTML=''}
  else if(e.ctrlKey&&(e.key==='c'||e.key==='C')&&inp.selectionStart===inp.selectionEnd){e.preventDefault();line(promptHTML()+' '+esc(inp.value)+'^C','cmdl');inp.value='';bottom()}
});
screen.addEventListener('click',()=>{if(!window.getSelection().toString())inp.focus()});
$('clearBtn').onclick=()=>{out.innerHTML='';inp.focus()};
$('keys').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();const k=b.dataset.k;if(k==='tab')complete();else if(k==='up')histMove(-1);else if(k==='down')histMove(1);else insertText(k);inp.focus()});
document.querySelector('.panel').addEventListener('click',e=>{
  const chip=e.target.closest('[data-ins]');if(chip){inp.value=chip.dataset.ins;inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);return}
  const box=e.target.closest('[data-go]');if(box&&S.unlocked){S.cur=+box.dataset.go;activate();save();renderPanel();print(`Jumped to task ${S.cur+1}: ${M[S.cur].title}`,'dim');bottom()}
});
$('lockBtn').onclick=()=>{S.unlocked=false;save();renderPanel();print('Hints locked again.','dim');bottom()};
let resetArmed=null;
$('resetBtn').onclick=()=>{const b=$('resetBtn');if(!resetArmed){b.textContent='Click again to erase all progress';resetArmed=setTimeout(()=>{b.textContent='Reset progress';resetArmed=null},3500);return}clearTimeout(resetArmed);resetArmed=null;b.textContent='Reset progress';resetAll()};
function resetAll(){S=fresh();save();out.innerHTML='';intro(true);renderPrompt();renderPanel();inp.focus()}

function intro(isNew){
  if(isNew){
    line(`<span class="pu">Port Penguin harbor terminal</span>
<span class="dim">70 tasks across 8 chapters, from your first command to shipping a release.
Type a command and press Enter. Your first task is in the logbook${window.matchMedia('(max-width:880px)').matches?' above':' on the right'}.
Type</span> help <span class="dim">to see every command, or</span> man <span class="dim">plus a command name to learn about it.</span>`,'sys big');
  }else{
    line(`<span class="pu">Welcome back, ${esc(rankFor(S.done.length).toLowerCase())}.</span>
<span class="dim">${S.cur<M.length?'Picking up at task '+(S.cur+1)+': '+esc(M[S.cur].title)+'.':'You’ve reached the end of the logbook. The harbor is yours to explore.'}</span>`,'sys big');
  }
}

const loaded=load();S=loaded||fresh();
intro(!loaded);activate();renderPrompt();renderPanel();save();
if(window.matchMedia('(pointer:fine)').matches)inp.focus();
window.__pp={sha256:sha256,state:()=>S,M:M};
})();
</script>
