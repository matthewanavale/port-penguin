<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0F2133" />
    <meta
      name="description"
      content="Learn Linux commands and Docker by playing a terminal game."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Port Penguin" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Port Penguin: learn Linux and Docker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">🐧</span>
        <div>
          <h1>Port Penguin</h1>
          <p>Learn Linux and Docker by running a harbor</p>
        </div>
      </div>
      <div class="rank">
        <strong id="rankName">Deckhand</strong><span id="xp">0 XP</span>
      </div>
    </header>

    <main class="layout">
      <section class="term" aria-label="Practice terminal">
        <div class="term-bar">
          <span>sandbox terminal</span
          ><span class="esc-hint">Esc: leave terminal</span
          ><button id="clearBtn" type="button">Clear screen</button>
        </div>
        <div id="term"></div>
        <div class="keys" id="keys" aria-label="Extra keys">
          <button
            type="button"
            data-k="ctrl-c"
            aria-label="Control C: stop the command"
          >
            ^C
          </button>
          <button
            type="button"
            data-k="ctrl-d"
            aria-label="Control D: end of input"
          >
            ^D
          </button>
          <button type="button" data-k="tab">Tab</button>
          <button type="button" data-k="up">↑</button>
          <button type="button" data-k="down">↓</button>
          <button type="button" data-k="-">-</button>
          <button type="button" data-k="/">/</button>
          <button type="button" data-k="~">~</button>
          <button type="button" data-k="|">|</button>
          <button type="button" data-k=">">&gt;</button>
          <button type="button" data-k="$">$</button>
        </div>
      </section>

      <aside class="panel">
        <div class="card mission" id="mission"></div>
        <div class="card yard" id="yard"></div>
        <details class="card learned" id="learned"></details>
        <div class="foot">
          <span>Progress saves in this browser.</span
          ><span
            ><button type="button" id="lockBtn" hidden>Lock hints</button>
            <button type="button" id="resetBtn">Reset progress</button></span
          >
        </div>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
