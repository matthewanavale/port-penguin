server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/manifest+json image/svg+xml;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
    }

    # The page and service worker must always be checked for updates.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js      { add_header Cache-Control "no-cache"; }

    # Icons rarely change.
    location ~* \.(png|svg)$ { add_header Cache-Control "public, max-age=604800"; }

    location / { try_files $uri $uri/ /index.html; }
}
